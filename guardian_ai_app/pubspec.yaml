name: guardian_ai_app
description: "Provo Guard - AI Companion Against Cyber Extortion, Sextortion & Digital Exploitation"
publish_to: 'none'
version: 1.0.2+4

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  # Modern Material 3 UI & Icons
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  percent_indicator: ^4.2.3
  intl: ^0.20.2

  # Local Security, Storage & Encryption
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3

  # Networking & HTTP
  http: ^1.2.1

  # Machine Learning & AI
  google_generative_ai: ^0.4.0

  # PDF Generation & Printing
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.2

  # Location & Maps
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  permission_handler: ^13.0.1
  image_picker: ^1.1.2
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
